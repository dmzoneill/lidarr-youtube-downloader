---
name: AI Issue and PR Responder

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to test response on"
        required: false
        default: "13"
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  ai-respond:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Google credentials
        env:
          OPENCODE_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        if: env.OPENCODE_KEY == '' && env.GOOGLE_CREDS != ''
        run: echo "$GOOGLE_CREDS" > /tmp/gcloud-credentials.json

      - name: Install Python dependencies
        run: |
          cat > /tmp/ai-responder-requirements.txt <<'EOF'
          requests==2.32.3 \
              --hash=sha256:70761cfe03c773ceb22aa2f671b4757976145175cdfca038c02654d061d6dcc6
          charset-normalizer==3.5.2 \
              --hash=sha256:b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
          idna==3.20 \
              --hash=sha256:ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
          urllib3==2.8.0 \
              --hash=sha256:0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
          certifi==2026.7.22 \
              --hash=sha256:62f22742b58a1a33014a2b6b706588a8d7e2a88ae7bd1a6ebe8c992928483775
          EOF
          python -m pip install --only-binary :all: --require-hashes --platform any --abi none --implementation py -r /tmp/ai-responder-requirements.txt

      - name: Download AI responder script
        run: |
          curl --proto '=https' --tlsv1.2 -fsS "https://raw.githubusercontent.com/dmzoneill/dmzoneill/main/ai-responder.py" -o ai-responder.py
          chmod +x ai-responder.py

      - name: Run AI responder
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL || 'big-pickle' }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcloud-credentials.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event_name == 'issues' && github.event.issue.number || inputs.issue_number || '' }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          ISSUE_REPO_URL: "https://github.com/${{ github.repository }}"
          EVENT_TYPE: ${{ github.event_name == 'pull_request' && 'pull_request' || 'issue' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ISSUES_CHAT_ID: ${{ secrets.TELEGRAM_ISSUES_CHAT_ID }}
          TELEGRAM_PR_CHAT_ID: ${{ secrets.TELEGRAM_PR_CHAT_ID }}
        run: python ai-responder.py
